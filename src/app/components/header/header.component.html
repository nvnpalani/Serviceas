<header class="header">
  <div class="container header-content">
    <div class="logo">
      <div class="dots">
        <span class="dot d1"></span>
        <span class="dot d2"></span>
        <span class="dot d3"></span>
        <span class="dot d4"></span>
      </div>
      <div class="logo-text">
        <span class="brand-name">FourDotz</span>
        <span class="brand-sub">Smart Apartment Living</span>
      </div>
    </div>
    
    <!-- Dark Mode & Mobile Menu Toggle Buttons -->
    <div class="mobile-controls">
      <button class="theme-toggle" (click)="toggleDarkMode()" aria-label="Toggle Dark Mode">
        <svg *ngIf="!isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg *ngIf="isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>

      <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Desktop & Mobile Navigation Wrapper -->
    <div class="nav-wrapper" [class.open]="isMenuOpen">
      <nav class="nav-links">
        <a href="#" class="active" (click)="closeMenu()">Home</a>
        <a href="#services" (click)="closeMenu()">Services</a>
        <a href="#builder" (click)="closeMenu()">Builder</a>
        <a href="#association" (click)="closeMenu()">Association</a>
        <a href="#resident" (click)="closeMenu()">Resident</a>
        <a href="#gatekeeper" (click)="closeMenu()">Gatekeeper</a>
        <a href="#contact" (click)="closeMenu()">Contact</a>
      </nav>
      
      <div class="nav-actions">
        <button class="btn btn-outline" style="border: 1px solid var(--primary); padding: 8px 16px;">Login</button>
        <button class="btn btn-primary" style="padding: 8px 16px;">Get Started</button>
      </div>
    </div>
  </div>
</header>
